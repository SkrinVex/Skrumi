name: Skrumi CI

on:
  workflow_call:
  pull_request:
  push:
    branches: [master]

concurrency:
  group: skrumi-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  editor-packages:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Audit editor identities and package VS Code
        run: |
          python3 tests/test_brand_audit.py
          python3 packaging/package_vsix.py editors/vscode "$(cat VERSION)" skrumi.vsix
      - name: Compile Zed extension with its locked dependencies
        run: |
          rustup target add wasm32-wasip1
          cargo build --locked --release --target wasm32-wasip1 --manifest-path editors/zed/Cargo.toml

  playground-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
        working-directory: tests/web
      - run: npx playwright install --with-deps chromium
        working-directory: tests/web
      - run: npm test
        working-directory: tests/web

  portable-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - uses: docker/setup-buildx-action@v3
      - name: Install native-window test dependencies
        run: sudo apt-get update && sudo apt-get install -y xvfb libx11-6 openbox fish
      - name: Build static musl binaries and run CTest inside Alpine
        run: docker buildx build --target portable --output type=local,dest=build-portable .
      - name: Verify no shared libraries and run standalone tests on Ubuntu
        run: xvfb-run -a python3 tests/standalone/test_portable_linux.py build-portable/skrumi
      - name: Exercise the portable installer native window on Ubuntu
        run: xvfb-run -a python3 tests/installer/test_gui.py build-portable/skrumi build-portable/skrumi-lsp
      - name: Build and verify the portable offline installer
        run: |
          mkdir -p installer-dist
          python3 packaging/build_gui_installer.py --runtime build-portable/skrumi --lsp build-portable/skrumi-lsp --output installer-dist/Skrumi-linux-x86_64.run
          python3 tests/installer/test_distribution.py installer-dist/Skrumi-linux-x86_64.run "$(tr -d '[:space:]' < VERSION)"
      - uses: actions/upload-artifact@v4
        with:
          name: gui-installer-candidate-linux
          path: installer-dist/Skrumi-linux-x86_64.run
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: linux-runtime
          path: build-portable/skrumi
          if-no-files-found: error

  # The playground page's Skrumi: WebAssembly built with Emscripten, run in Node.
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: mymindstorm/setup-emsdk@v14
        with:
          version: 6.0.10
      - name: Build Skrumi for WebAssembly
        run: |
          emcmake cmake -S . -B web -DCMAKE_BUILD_TYPE=Release
          cmake --build web -j4
          cp web/skrumi*.js web/skrumi*.wasm site/playground/
      - name: Run the playground's examples and limits
        run: |
          node tests/web/test_playground.js site/playground
          node tests/web/test_builder_runtime.js site/playground
          node tests/web/test_system_ui_runtime.js site/playground
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run the interface builder with real WebAssembly in Chromium
        working-directory: tests/web
        run: |
          npm ci
          npx playwright install --with-deps chromium
          node test_builder.js --runtime

  desktop:
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: linux
          - os: windows-latest
            name: windows
    runs-on: ${{ matrix.os }}
    name: desktop-${{ matrix.name }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install Linux graphics development and test packages
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libxcb1-dev libxau-dev libxdmcp-dev xvfb libx11-6 openbox fish

      - name: Configure CMake
        run: cmake -B build -S . -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release --parallel 4

      - name: Run Tests (CTest)
        run: ctest --test-dir build -C Release --output-on-failure -LE standalone

      - name: Build and run standalone executables in clean temporary directories
        shell: bash
        env:
          SKRUMI_REQUIRE_GRAPHICS_TESTS: '1'
          SKRUMI_GUI_SCREENSHOTS: ${{ github.workspace }}/build/gui-screenshots
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            xvfb-run -a ctest --test-dir build -C Release --output-on-failure -L standalone
          else
            ctest --test-dir build -C Release --output-on-failure -L standalone
          fi

      - name: Verify Version and Help
        shell: bash
        run: |
          BIN=./build/skrumi
          LSP_BIN=./build/skrumi-lsp
          if [ "$RUNNER_OS" = "Windows" ]; then
            if [ -f "./build/Release/skrumi.exe" ]; then
              BIN=./build/Release/skrumi.exe
              LSP_BIN=./build/Release/skrumi-lsp.exe
            else
              BIN=./build/skrumi.exe
              LSP_BIN=./build/skrumi-lsp.exe
            fi
          fi
          test "$($BIN --version)" = "Skrumi $(tr -d '[:space:]' < VERSION)"
          $BIN --help | grep -q "github.com/SkrinVex/Skrumi"
          $BIN --help | grep -q "DOCUMENTATION.md"
          test "$($LSP_BIN --version)" = "skrumi-lsp $(tr -d '[:space:]' < VERSION)"
          $LSP_BIN --help | grep -q "Language Server"

      - name: Prepare Windows installer payload
        if: runner.os == 'Windows'
        shell: bash
        run: |
          mkdir -p dist
          if [ -f build/Release/skrumi.exe ]; then
            cp build/Release/skrumi.exe build/Release/skrumi-lsp.exe dist/
          else
            cp build/skrumi.exe build/skrumi-lsp.exe dist/
          fi
          cp VERSION dist/VERSION
          cp -R std dist/std
          cp -R editors dist/editors
          cp packaging/windows/install.ps1 packaging/windows/install.cmd dist/
          cp packaging/windows/uninstall.ps1 packaging/windows/uninstall.cmd dist/
          python packaging/package_vsix.py editors/vscode "$(tr -d '[:space:]' < VERSION)" "dist/skrumi-$(tr -d '[:space:]' < VERSION).vsix"
          for dll_dir in build build/Release; do
            if [ -d "$dll_dir" ]; then find "$dll_dir" -maxdepth 1 -type f -iname '*.dll' -exec cp -t dist {} +; fi
          done

      - name: Test CMD launchers with Windows PowerShell 5.1
        if: runner.os == 'Windows'
        shell: powershell
        run: ./packaging/windows/test_install.ps1 -PackageDir ./dist
      - name: Test installer scripts with PowerShell 7
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./packaging/windows/test_install.ps1 -PackageDir ./dist -Direct

      - name: Build and verify the offline GUI distribution
        shell: bash
        run: |
          BIN_DIR=build
          SUFFIX=
          ASSET=Skrumi-linux-x86_64.run
          if [ "$RUNNER_OS" = "Windows" ]; then
            BIN_DIR=build/Release
            SUFFIX=.exe
            ASSET=Skrumi-windows-x86_64.exe
          fi
          mkdir -p installer-dist
          python packaging/build_gui_installer.py --runtime "$BIN_DIR/skrumi$SUFFIX" --lsp "$BIN_DIR/skrumi-lsp$SUFFIX" --output "installer-dist/$ASSET"
          python tests/installer/test_distribution.py "installer-dist/$ASSET" "$(tr -d '[:space:]' < VERSION)"

      - name: Verify real disk exhaustion and denied publication on Linux
        if: runner.os == 'Linux'
        shell: bash
        run: |
          TEST_VOLUME="$RUNNER_TEMP/skrumi-installer-test-volume"
          mkdir -p "$TEST_VOLUME"
          sudo mount -t tmpfs -o "size=96m,uid=$(id -u),gid=$(id -g),mode=0700" tmpfs "$TEST_VOLUME"
          trap 'sudo umount "$TEST_VOLUME"' EXIT
          python tests/installer/test_disk_full.py installer-dist/Skrumi-linux-x86_64.run "$TEST_VOLUME"

      - name: Verify real disk exhaustion and locked publication on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./packaging/windows/test_disk_volume.ps1 -Installer installer-dist/Skrumi-windows-x86_64.exe

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ runner.os == 'Windows' && 'gui-installer-candidate-windows' || 'gui-installer-native-linux' }}
          path: installer-dist/*
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: installer-screenshots-${{ matrix.name }}
          path: build/gui-screenshots/*.png
          if-no-files-found: ignore
